permalink: /travel-map/
title: 旅行地图
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行地图</title>
    <style>
        :root {
            --primary-color: #8B5CF6;
            --primary-deep: #7c3fe6;
            --primary-soft: #C084FC;
            --pink: #ff6b9d;
            --ink: #3b2f4a;
            --ink-soft: #7a6b8a;
            --land: #e9e0f7;
            --land-hover: #dbc9f2;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            -webkit-text-size-adjust: 100%;
        }

        .back-link {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 50;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 9px 18px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            transition: all 0.3s;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-2px);
        }

        .page {
            max-width: 1160px;
            margin: 0 auto;
            padding: 78px 16px 56px;
        }

        .page-head {
            text-align: center;
            margin-bottom: 22px;
        }
        .page-head h1 {
            font-size: 2.1rem;
            margin: 0 0 8px;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary-color), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-head p {
            margin: 0;
            color: #fff;
            font-size: 0.95rem;
            text-shadow: 0 1px 6px rgba(124, 63, 230, 0.5);
        }

        /* ---------- 顶部统计 ---------- */
        .stats-card {
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 16px 22px;
            box-shadow: 0 12px 24px -12px rgba(80, 40, 140, 0.35);
            margin-bottom: 14px;
        }
        .stats-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stat-num {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
        }
        .stat-unit {
            font-size: 0.9rem;
            color: var(--ink-soft);
            margin-left: 6px;
        }
        .stat-sub {
            font-size: 0.88rem;
            color: var(--ink-soft);
        }
        .stat-sub b {
            color: var(--pink);
        }
        .progress-wrap {
            margin-top: 12px;
            height: 10px;
            border-radius: 99px;
            background: #ece7f6;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--primary-color), var(--pink));
            transition: width 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        /* ---------- 模式切换 ---------- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .mode-switch {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 99px;
            padding: 4px;
            gap: 4px;
        }
        .mode-btn {
            border: none;
            background: transparent;
            color: var(--ink-soft);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .mode-btn.active {
            background: white;
            color: var(--primary-color);
            box-shadow: 0 4px 10px -4px rgba(80, 40, 140, 0.5);
        }
        .hint {
            font-size: 0.85rem;
            color: #fff;
            text-shadow: 0 1px 6px rgba(124, 63, 230, 0.5);
        }

        /* ---------- 主体：地图 + 清单 ---------- */
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
            gap: 16px;
            align-items: start;
        }

        .map-card {
            position: relative;
            background: var(--glass-bg);
            border-radius: 22px;
            padding: 12px;
            box-shadow: 0 16px 30px -18px rgba(80, 40, 140, 0.5);
        }
        #chinaMap {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 14px;
            touch-action: manipulation;
        }
        .province {
            fill: var(--land);
            stroke: #ffffff;
            stroke-width: 1;
            vector-effect: non-scaling-stroke;
            cursor: pointer;
            transition: fill 0.25s;
            transform-box: fill-box;
            transform-origin: center;
        }
        .province:hover { fill: var(--land-hover); }
        .province:focus-visible {
            outline: none;
            stroke: var(--primary-deep);
            stroke-width: 2.5;
        }
        .province.visited {
            fill: url(#gradVisited);
            stroke: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 5px rgba(162, 89, 230, 0.75));
        }
        .province.wish {
            fill: rgba(255, 107, 157, 0.3);
            stroke: var(--pink);
            stroke-width: 1.2;
            stroke-dasharray: 5 3;
        }
        .province.pop { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .nine-dash {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0.55;
            pointer-events: none;
        }
        .legend text {
            font-family: inherit;
            font-size: 27px;
            fill: #6d5c85;
        }
        .sea-label {
            font-family: inherit;
            font-size: 25px;
            fill: #9dabc4;
            letter-spacing: 3px;
            text-anchor: middle;
            pointer-events: none;
        }

        .tooltip {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            background: rgba(45, 28, 70, 0.92);
            color: white;
            font-size: 0.82rem;
            line-height: 1.45;
            padding: 7px 11px;
            border-radius: 10px;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -120%);
            transition: opacity 0.16s;
        }
        .tooltip.show { opacity: 1; }
        .tooltip .tip-status { color: #f0d9ff; }

        /* ---------- 省份清单 ---------- */
        .panel {
            background: var(--glass-bg);
            border-radius: 22px;
            padding: 16px 18px 18px;
            box-shadow: 0 16px 30px -18px rgba(80, 40, 140, 0.5);
            max-height: 640px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .panel h2 {
            font-size: 1rem;
            margin: 0 0 4px;
            color: var(--primary-deep);
        }
        .panel .panel-note {
            font-size: 0.78rem;
            color: var(--ink-soft);
            margin: 0 0 12px;
        }
        .region-group { margin-bottom: 12px; }
        .region-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.06em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .region-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee7f7;
        }
        .region-title .region-count { font-weight: 500; color: #b3a6c4; }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            font-size: 0.85rem;
            color: #5b4a70;
            background: #f4f0fb;
            border: 1px solid #e7defa;
            border-radius: 99px;
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { background: #ebe2fa; transform: translateY(-1px); }
        .chip.visited {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-soft));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 10px -4px rgba(139, 92, 246, 0.9);
        }
        .chip.wish {
            background: rgba(255, 107, 157, 0.14);
            border-color: rgba(255, 107, 157, 0.5);
            color: #d63f74;
        }
        .chip .chip-mark { font-size: 0.75rem; }

        /* ---------- 底部操作 ---------- */
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 18px;
        }
        .action-btn {
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--primary-deep);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .action-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -8px rgba(80, 40, 140, 0.6);
        }
        .action-btn.danger { color: #c2410c; }

        /* ---------- 提示条 ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 34px;
            transform: translate(-50%, 20px);
            background: rgba(45, 28, 70, 0.94);
            color: white;
            font-size: 0.9rem;
            padding: 11px 22px;
            border-radius: 99px;
            box-shadow: 0 12px 26px -12px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 200;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 880px) {
            .layout { grid-template-columns: 1fr; }
            .panel { max-height: none; }
            .page { padding-top: 70px; }
            .page-head h1 { font-size: 1.7rem; }
            /* 手机上三个按钮等宽铺开，别排成一大一小 */
            .actions .action-btn { flex: 1 1 30%; padding: 10px 6px; }
        }
    </style>
</head>
<body>
    <a href="{{ "/" | relative_url }}" class="back-link">← 返回首页</a>

    <div class="page">
        <div class="page-head">
            <h1>🗺️ 我的旅行地图</h1>
            <p>点亮走过的每一寸土地，记录想去的每个远方</p>
        </div>

        <div class="stats-card">
            <div class="stats-head">
                <div>
                    <span class="stat-num" id="statVisited">0</span>
                    <span class="stat-unit">/ <span id="statTotal">34</span> 个省级行政区已点亮</span>
                </div>
                <div class="stat-sub">点亮率 <b id="statRate">0%</b> · 心愿单 <b id="statWish">0</b> 个</div>
            </div>
            <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
        </div>

        <div class="toolbar">
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="visited">✅ 我去过</button>
                <button class="mode-btn" data-mode="wish">💗 我想去</button>
            </div>
            <span class="hint" id="modeHint"></span>
        </div>

        <div class="layout">
            <div class="map-card" id="mapCard">
                <svg id="chinaMap" role="group" aria-label="中国省级旅行地图"></svg>
                <div class="tooltip" id="tooltip"></div>
            </div>

            <aside class="panel">
                <h2>省份清单</h2>
                <p class="panel-note">也可以直接点这里的名字来点亮</p>
                <div id="provinceList"></div>
            </aside>
        </div>

        <div class="actions">
            <button class="action-btn" id="exportBtn">📋 备份进度</button>
            <button class="action-btn" id="importBtn">📥 恢复进度</button>
            <button class="action-btn danger" id="resetBtn">🗑️ 全部重置</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="{{ '/assets/china-map-data.js' | relative_url }}"></script>
    <script>
    (function () {
        var DATA = window.CHINA_MAP_DATA;
        var STORE_KEY = 'travel-map-progress-v1';
        var REGION_ORDER = ['华北', '东北', '华东', '华中', '华南', '西南', '西北'];
        var MODE_TEXT = {
            visited: '点击省份即可点亮 ✅',
            wish: '点击省份加入心愿单 💗'
        };

        var svg = document.getElementById('chinaMap');
        var mapCard = document.getElementById('mapCard');
        var tooltip = document.getElementById('tooltip');
        var toastEl = document.getElementById('toast');
        var paths = {};   // adcode -> <path>
        var chips = {};   // adcode -> 清单按钮

        var mode = 'visited';
        var marks = loadMarks();
        var names = {};   // adcode -> 省份简称，提示用

        if (!DATA || !DATA.provinces) {
            mapCard.innerHTML = '<p style="padding:40px;text-align:center;color:#7a6b8a">地图数据没加载出来，刷新试试～</p>';
            return;
        }

        /* ---------------- 数据存取 ---------------- */
        // localStorage 在隐私模式或被禁用时会抛错，这里全部兜住，退化成"不保存"
        function loadMarks() {
            try {
                var raw = window.localStorage.getItem(STORE_KEY);
                var parsed = raw ? JSON.parse(raw) : null;
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveMarks() {
            try {
                window.localStorage.setItem(STORE_KEY, JSON.stringify(marks));
            } catch (e) { /* 存不了就算了，不影响本次浏览 */ }
        }

        function today() {
            var d = new Date();
            var m = String(d.getMonth() + 1);
            var day = String(d.getDate());
            return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
        }

        /* ---------------- 地图渲染 ---------------- */
        function renderMap() {
            var H = viewBoxHeight();
            // 渐变按整幅地图取 userSpaceOnUse，这样各省颜色连成一片，
            // 不会出现"同一个省一半紫一半粉"或深浅不一的情况
            var html = [
                '<defs>',
                '<linearGradient id="gradVisited" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="' + H + '">',
                '<stop offset="0%" stop-color="#7c3fe6"/>',
                '<stop offset="55%" stop-color="#a855f7"/>',
                '<stop offset="100%" stop-color="#e05fa8"/>',
                '</linearGradient>',
                '<linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">',
                '<stop offset="0%" stop-color="#eaf2fd"/>',
                '<stop offset="100%" stop-color="#d3e3f8"/>',
                '</linearGradient>',
                '</defs>',
                '<rect x="0" y="0" width="1000" height="' + H + '" rx="14" fill="url(#seaGrad)"/>'
            ];

            DATA.provinces.forEach(function (p) {
                names[p.id] = p.short;
                html.push(
                    '<path class="province" data-id="' + p.id + '" d="' + p.d + '" tabindex="0" role="button" ' +
                    'aria-label="' + p.short + '"><title>' + p.short + '</title></path>'
                );
            });

            // 九段线画在最上层，不参与点击
            if (DATA.nineDash) {
                html.push('<path class="nine-dash" d="' + DATA.nineDash + '"/>');
            }

            // 图上左下角的海面留白正好放图例
            html.push(legendSvg(H));
            if (DATA.southSea) {
                html.push('<text class="sea-label" x="' + DATA.southSea.x + '" y="' + DATA.southSea.y + '">南海诸岛</text>');
            }

            svg.setAttribute('viewBox', DATA.viewBox);
            svg.innerHTML = html.join('');

            DATA.provinces.forEach(function (p) {
                var el = svg.querySelector('[data-id="' + p.id + '"]');
                paths[p.id] = el;
                el.addEventListener('click', function () { toggle(p.id); });
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggle(p.id);
                    }
                });
                bindTooltip(el, p);
            });
        }

        // 画在 SVG 里的图例，跟着地图一起缩放
        function legendSvg(mapHeight) {
            var items = [
                { text: '没去过', fill: '#ece4f8', stroke: '#ffffff', dash: '' },
                { text: '已点亮', fill: '#a855f7', stroke: 'rgba(255,255,255,0.9)', dash: '' },
                { text: '想去', fill: 'rgba(255,107,157,0.22)', stroke: '#ff6b9d', dash: '5 3' }
            ];
            var x = 46, rowH = 46;
            var y = mapHeight - 30 - rowH * items.length - 30;
            var out = ['<g class="legend">',
                '<rect x="' + x + '" y="' + y + '" width="266" height="' + (rowH * items.length + 30) + '" ' +
                'rx="16" fill="rgba(255,255,255,0.78)" stroke="rgba(139,92,246,0.16)"/>'];

            items.forEach(function (item, i) {
                var cy = y + 32 + i * rowH;
                out.push('<rect x="' + (x + 22) + '" y="' + (cy - 13) + '" width="46" height="26" rx="7" fill="' +
                    item.fill + '" stroke="' + item.stroke + '" stroke-width="1.5"' +
                    (item.dash ? ' stroke-dasharray="' + item.dash + '"' : '') + '/>');
                out.push('<text x="' + (x + 86) + '" y="' + (cy + 10) + '">' + item.text + '</text>');
            });

            out.push('</g>');
            return out.join('');
        }

        function viewBoxHeight() {
            var parts = (DATA.viewBox || '0 0 1000 1155').split(/\s+/);
            return parseFloat(parts[3]) || 1155;
        }

        /* ---------------- 悬停提示 ---------------- */
        function bindTooltip(el, province) {
            // 触摸设备没有 hover，绑了反而会和点击打架
            if (!window.matchMedia || !window.matchMedia('(hover: hover)').matches) return;

            function move(e) {
                var box = mapCard.getBoundingClientRect();
                tooltip.style.left = (e.clientX - box.left) + 'px';
                tooltip.style.top = (e.clientY - box.top) + 'px';
            }
            el.addEventListener('mouseenter', function (e) {
                var mark = marks[province.id];
                var status = mark
                    ? (mark.s === 'visited' ? '✅ 已点亮 · ' + mark.t : '💗 想去 · ' + mark.t)
                    : '还没点亮 · 点一下试试';
                tooltip.innerHTML = province.name + '<br><span class="tip-status">' + status + '</span>';
                move(e);
                tooltip.classList.add('show');
            });
            el.addEventListener('mousemove', move);
            el.addEventListener('mouseleave', function () {
                tooltip.classList.remove('show');
            });
        }

        /* ---------------- 省份清单 ---------------- */
        function renderList() {
            var groups = {};
            DATA.provinces.forEach(function (p) {
                (groups[p.region] = groups[p.region] || []).push(p);
            });

            var html = '';
            REGION_ORDER.concat(Object.keys(groups).filter(function (r) {
                return REGION_ORDER.indexOf(r) === -1;
            })).forEach(function (region) {
                var list = groups[region];
                if (!list || !list.length) return;
                html += '<div class="region-group"><div class="region-title">' + region +
                        '<span class="region-count" data-region="' + region + '"></span></div><div class="chips">';
                list.forEach(function (p) {
                    html += '<button class="chip" data-id="' + p.id + '">' + p.short +
                            '<span class="chip-mark"></span></button>';
                });
                html += '</div></div>';
            });

            document.getElementById('provinceList').innerHTML = html;
            Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
                var id = chip.getAttribute('data-id');
                chips[id] = chip;
                chip.addEventListener('click', function () { toggle(id); });
            });
        }

        /* ---------------- 点亮 / 取消 ---------------- */
        function toggle(id) {
            var mark = marks[id];
            if (mark && mark.s === mode) {
                delete marks[id];
            } else {
                marks[id] = { s: mode, t: today() };
            }
            saveMarks();
            sync();

            var el = paths[id];
            if (el && marks[id]) {
                el.classList.remove('pop');
                void el.offsetWidth;   // 强制重排，让动画能连着播
                el.classList.add('pop');
            }
            if (marks[id]) {
                showToast((marks[id].s === 'visited' ? '✅ 点亮了 ' : '💗 加入了 ') + (names[id] || '') +
                          (marks[id].s === 'visited' ? '' : ' 心愿单'));
            } else {
                showToast('已取消 ' + (names[id] || ''));
            }
        }

        /* ---------------- 状态同步 ---------------- */
        function sync() {
            var visited = 0, wish = 0;
            var regionVisited = {};

            DATA.provinces.forEach(function (p) {
                var mark = marks[p.id];
                var status = mark ? mark.s : '';
                var el = paths[p.id];
                var chip = chips[p.id];

                if (el) {
                    el.classList.toggle('visited', status === 'visited');
                    el.classList.toggle('wish', status === 'wish');
                }
                if (chip) {
                    chip.classList.toggle('visited', status === 'visited');
                    chip.classList.toggle('wish', status === 'wish');
                    chip.querySelector('.chip-mark').textContent =
                        status === 'visited' ? '✓' : (status === 'wish' ? '♡' : '');
                    chip.title = mark ? (mark.s === 'visited' ? '点亮于 ' : '想去 · ') + mark.t : '';
                }

                if (status === 'visited') {
                    visited++;
                    regionVisited[p.region] = (regionVisited[p.region] || 0) + 1;
                } else if (status === 'wish') {
                    wish++;
                }
            });

            var total = DATA.provinces.length;
            var rate = total ? Math.round(visited / total * 100) : 0;
            document.getElementById('statVisited').textContent = visited;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statWish').textContent = wish;
            document.getElementById('statRate').textContent = rate + '%';
            document.getElementById('progressBar').style.width = rate + '%';

            Array.prototype.forEach.call(document.querySelectorAll('[data-region]'), function (el) {
                var region = el.getAttribute('data-region');
                var count = regionVisited[region] || 0;
                el.textContent = count ? '已点亮 ' + count + ' 个' : '';
            });
        }

        var toastTimer = null;
        function showToast(text) {
            toastEl.textContent = text;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
        }

        /* ---------------- 模式切换 ---------------- */
        function setMode(next) {
            mode = next;
            Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-mode') === next);
            });
            document.getElementById('modeHint').textContent = MODE_TEXT[next];
        }
        Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        });

        /* ---------------- 备份 / 恢复 / 重置 ---------------- */
        // 进度只存在本机浏览器里，换设备或清缓存就会丢，所以给个备份码
        document.getElementById('exportBtn').addEventListener('click', function () {
            var code = btoa(JSON.stringify(marks));
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(function () {
                    showToast('备份码已复制到剪贴板');
                }, function () {
                    window.prompt('复制这段备份码保存好：', code);
                });
            } else {
                window.prompt('复制这段备份码保存好：', code);
            }
        });

        document.getElementById('importBtn').addEventListener('click', function () {
            var code = window.prompt('粘贴之前的备份码：');
            if (code === null) return;
            var parsed;
            try {
                parsed = JSON.parse(atob(code.trim()));
            } catch (e) {
                showToast('备份码看不懂，再检查一下～');
                return;
            }
            var clean = {};
            DATA.provinces.forEach(function (p) {
                var mark = parsed[p.id];
                if (mark && (mark.s === 'visited' || mark.s === 'wish')) {
                    clean[p.id] = { s: mark.s, t: String(mark.t || today()) };
                }
            });
            marks = clean;
            saveMarks();
            sync();
            showToast('恢复成功，共 ' + Object.keys(clean).length + ' 条记录');
        });

        document.getElementById('resetBtn').addEventListener('click', function () {
            if (!window.confirm('确定清空所有点亮记录吗？这一步不能撤销。')) return;
            marks = {};
            saveMarks();
            sync();
            showToast('已全部重置');
        });

        /* ---------------- 启动 ---------------- */
        renderMap();
        renderList();
        setMode('visited');
        sync();
    })();
    </script>
</body>
</html>
